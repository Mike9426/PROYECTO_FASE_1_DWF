<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirar Fondos</title>

    <!-- Bootstrap & Iconos -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap"
          rel="stylesheet">

    <!-- Axios & SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', 'Lato', sans-serif;
            background-color: #f4f6f9;
        }

        .d-flex {
            min-height: 100vh;
        }

        /* ---------- SIDEBAR (mismo estilo dashboard) ---------- */
        .sidebar {
            height: 100vh;
            background: #111827;
            color: #e5e7eb;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 12px rgba(15, 23, 42, 0.35);
        }

        .user-summary {
            text-align: left;
            margin-bottom: 30px;
        }

        .user-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #f9fafb;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 10px;
            background-color: transparent;
            color: #e5e7eb;
            text-decoration: none;
            transition: all 0.25s ease;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar .nav-link:hover {
            background-color: #1f2937;
            transform: translateX(3px);
            border-left-color: #10B981;
            color: #ffffff;
        }

        .sidebar .nav-link.active {
            background-color: #1f2937;
            border-left-color: #10B981;
            color: #ffffff;
        }

        .sidebar .logout-btn {
            margin-top: auto;
            margin-bottom: 10px;
            width: 100%;
            background-color: #ef4444;
            border: none;
            color: white;
            padding: 11px;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .sidebar .logout-btn i {
            margin-right: 6px;
        }

        .sidebar .logout-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
        }

        /* ---------- MAIN CONTENT ---------- */
        .main-content {
            padding: 30px;
        }

        .page-title {
            color: #1f2937;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 22px;
        }

        .page-subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        /* ---------- CARD RETIRO ---------- */
        .withdraw-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.10);
            overflow: hidden;
            background: #ffffff;
        }

        .withdraw-card .card-header {
            background-color: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 26px;
            display: flex;
            align-items: center;
        }

        .withdraw-card .card-header i {
            font-size: 20px;
            color: #10B981;
            margin-right: 10px;
        }

        .withdraw-card .card-header h4 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #111827;
        }

        .withdraw-card .card-body {
            padding: 26px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-control {
            border-radius: 999px;
            padding: 12px 18px;
            border: 1.5px solid #d1d5db;
            transition: all 0.2s ease;
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            background-color: #ffffff;
        }

        .form-control:focus {
            border-color: #10B981;
            box-shadow: 0 0 0 0.16rem rgba(16, 185, 129, 0.25);
        }

        .input-group-text {
            border-radius: 999px 0 0 999px;
            border: 1.5px solid #d1d5db;
            border-right: 0;
            background-color: #f3f4f6;
            font-size: 14px;
        }

        .input-group .form-control {
            border-radius: 0 999px 999px 0;
        }

        .btn-withdraw {
            background: #10B981;
            border: none;
            border-radius: 999px;
            padding: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            color: #ffffff;
        }

        .btn-withdraw:hover {
            background: #0e9a6f;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(16, 185, 129, 0.30);
        }

        .btn-withdraw i {
            margin-right: 6px;
        }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="user-summary">
            <div class="user-label">Cuenta a nombre de</div>
            <div id="user-name" class="user-name">Cliente</div>
        </div>

        <a href="/client/make-transaction" class="nav-link">
            <i class="fas fa-exchange-alt"></i>
            Realizar transacción
        </a>
        <a href="/client/deposit-funds" class="nav-link">
            <i class="fas fa-coins"></i>
            Depositar fondos
        </a>
        <a href="/client/withdraw-funds" class="nav-link active">
            <i class="fas fa-hand-holding-usd"></i>
            Retirar fondos
        </a>
        <a href="/client/transaction-history" class="nav-link">
            <i class="fas fa-history"></i>
            Historial de transacciones
        </a>

        <button class="logout-btn" onclick="window.location.href='/logout'">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content flex-grow-1">
        <h2 class="page-title">Retirar fondos de tu cuenta</h2>
        <p class="page-subtitle">
            Selecciona una de tus cuentas activas e ingresa el monto que deseas retirar.
        </p>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="withdraw-card">
                    <div class="card-header">
                        <i class="fas fa-hand-holding-usd"></i>
                        <h4 class="mb-0">Retirar fondos</h4>
                    </div>
                    <div class="card-body">
                        <form id="withdraw-form">
                            <!-- Seleccionar Cuenta -->
                            <div class="form-group">
                                <label for="account-select" class="form-label">Seleccionar cuenta</label>
                                <select class="form-control" id="account-select" required>
                                    <!-- Cuentas se cargarán dinámicamente -->
                                </select>
                            </div>

                            <!-- Ingresar Monto -->
                            <div class="form-group">
                                <label for="withdraw-amount" class="form-label">Monto a retirar</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">$</span>
                                    </div>
                                    <input type="number"
                                           class="form-control"
                                           id="withdraw-amount"
                                           step="0.01"
                                           min="0"
                                           placeholder="Ingrese el monto"
                                           required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-withdraw btn-block mt-3">
                                <i class="fas fa-money-bill-wave"></i>
                                Retirar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Formatear número de cuenta en grupos de 3 dígitos
    function formatAccountNumber(accountNumber) {
        return accountNumber.replace(/(\d{3})(?=\d)/g, '$1-');
    }

    // Obtener el usuario actual y sus cuentas
    axios.get('/api/users/current')
        .then(response => {
            const userEmail = response.data.email;
            const userName = response.data.name;

            // Mostrar nombre en sidebar
            const userNameEl = document.getElementById('user-name');
            if (userNameEl) {
                userNameEl.textContent = userName;
            }

            // Obtener las cuentas del usuario
            return axios.get(`/api/account/${encodeURIComponent(userEmail)}`);
        })
        .then(response => {
            const accounts = response.data;
            const accountSelect = document.getElementById('account-select');

            if (accounts.length === 0) {
                accountSelect.innerHTML = '<option value="">No hay cuentas disponibles</option>';
                accountSelect.disabled = true;
            } else {
                accounts.forEach(account => {
                    const option = document.createElement('option');
                    option.value = account.accountNumber;
                    option.textContent =
                        `Cuenta ${formatAccountNumber(account.accountNumber)} · Saldo: $${account.balance.toFixed(2)}`;
                    accountSelect.appendChild(option);
                });
            }
        })
        .catch(error => {
            console.error('Error al obtener usuario/cuentas:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudo cargar la información del usuario o sus cuentas. Intente más tarde.'
            });
        });

    // Manejar el envío del formulario
    document.getElementById('withdraw-form').addEventListener('submit', function (event) {
        event.preventDefault();

        const accountNumber = document.getElementById('account-select').value;
        const withdrawAmount = parseFloat(document.getElementById('withdraw-amount').value);

        if (!accountNumber || isNaN(withdrawAmount) || withdrawAmount <= 0) {
            Swal.fire({
                icon: 'warning',
                title: 'Entrada inválida',
                text: 'Seleccione una cuenta válida e ingrese un monto mayor a 0.'
            });
            return;
        }

        // Confirmación antes del retiro
        Swal.fire({
            title: 'Confirmar retiro',
            html: `¿Deseas retirar <b>$${withdrawAmount.toFixed(2)}</b> de la cuenta <b>${formatAccountNumber(accountNumber)}</b>?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Confirmar',
            cancelButtonText: 'Cancelar'
        }).then(result => {
            if (result.isConfirmed) {
                axios.post('/api/transaction/withdraw', {
                    accountNumber: accountNumber,
                    amount: withdrawAmount
                })
                    .then(() => {
                        Swal.fire({
                            icon: 'success',
                            title: 'Retiro exitoso',
                            text: `Se retiraron $${withdrawAmount.toFixed(2)} de la cuenta ${formatAccountNumber(accountNumber)}.`,
                            confirmButtonText: 'OK'
                        }).then(() => {
                            location.reload();
                        });
                    })
                    .catch(error => {
                        console.error('Error al procesar el retiro:', error);
                        Swal.fire({
                            icon: 'error',
                            title: 'Retiro fallido',
                            text: error.response ? error.response.data : 'Ocurrió un error. Intente nuevamente más tarde.'
                        });
                    });
            }
        });
    });
</script>
</body>
</html>
