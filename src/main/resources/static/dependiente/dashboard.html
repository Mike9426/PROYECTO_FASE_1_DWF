<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Dependiente Bancario</title>

    <!-- Bootstrap & Iconos -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap"
          rel="stylesheet">

    <!-- Axios & SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', 'Lato', sans-serif;
            background-color: #f4f6f9;
        }

        .d-flex {
            min-height: 100vh;
        }

        /* -------- SIDEBAR OFICIAL (mismo estilo del dashboard cliente/cajero) -------- */
        .sidebar {
            height: 100vh;
            background: #111827;
            color: #e5e7eb;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 12px rgba(15, 23, 42, 0.35);
            align-items: center;
        }

        .profile-img {
            width: 72px;
            height: 72px;
            border-radius: 999px;
            margin-bottom: 20px;
            border: 2px solid #10B981;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .profile-img:hover {
            transform: scale(1.03);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.6);
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 10px;
            background-color: transparent;
            color: #e5e7eb;
            text-decoration: none;
            transition: all 0.25s ease;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar .nav-link:hover {
            background-color: #1f2937;
            transform: translateX(3px);
            border-left-color: #10B981;
            color: #ffffff;
        }

        .sidebar .nav-link.active {
            background-color: #1f2937;
            border-left-color: #10B981;
            color: #ffffff;
        }

        .sidebar .logout-btn {
            margin-top: auto;
            margin-bottom: 10px;
            width: 100%;
            background-color: #ef4444;
            border: none;
            color: white;
            padding: 11px;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .sidebar .logout-btn i {
            margin-right: 6px;
        }

        .sidebar .logout-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
        }

        /* -------- MAIN CONTENT -------- */
        .main-content {
            padding: 40px;
            width: 100%;
        }

        .welcome-title {
            color: #1f2937;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: left;
            position: relative;
            font-size: 20px;
        }

        .welcome-title:after {
            content: '';
            display: block;
            width: 70px;
            height: 3px;
            background: #10B981;
            margin-top: 10px;
            border-radius: 999px;
        }

        .section-title {
            color: #4b5563;
            font-weight: 500;
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* -------- TARJETAS DE CUENTAS -------- */
        .account-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            border: none;
            margin-bottom: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .account-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.14);
        }

        .account-card .card-body {
            padding: 18px 20px;
        }

        .account-card .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 6px;
        }

        .account-card .card-text {
            font-size: 14px;
            color: #4b5563;
        }

        .btn-add-account {
            background: #10B981;
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            margin-top: 12px;
            transition: all 0.2s ease;
        }

        .btn-add-account:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
        }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- SIDEBAR (igual estilo que cajero) -->
    <div class="sidebar">
        <img src="/img/clientpfp.png"
             alt="Imagen de perfil"
             class="profile-img"
             onclick="window.location.href='/dependiente/dashboard'">

        <a href="/dependiente/make-transaction" class="nav-link">
            <i class="fas fa-exchange-alt"></i> Realizar transacción
        </a>
        <a href="/dependiente/deposit-funds" class="nav-link">
            <i class="fas fa-coins"></i> Depositar fondos
        </a>
        <a href="/dependiente/withdraw-funds" class="nav-link">
            <i class="fas fa-hand-holding-usd"></i> Retirar fondos
        </a>
        <a href="/dependiente/transaction-history" class="nav-link">
            <i class="fas fa-history"></i> Historial de transacciones
        </a>
        <a href="/dependiente/special-services" class="nav-link">
            <i class="fas fa-key"></i> Servicios especiales
        </a>

        <button class="logout-btn" onclick="window.location.href='/logout'">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="flex-grow-1 main-content">
        <div class="container-fluid">
            <h2 class="welcome-title" id="welcome-sign"></h2>
            <h5 class="section-title">Cuentas bancarias del cliente</h5>

            <div id="accounts-container" class="mt-2">
                <!-- Las cuentas aparecerán aquí -->
            </div>
        </div>
    </div>
</div>

<script>
    // Función para formatear el número de cuenta en grupos de 3 dígitos
    function formatAccountNumber(accountNumber) {
        return accountNumber.replace(/(\d{3})(?=\d)/g, '$1-');
    }

    // Fetch the current logged-in user's email and DUI
    axios.get('/api/users/current')
        .then(response => {
            const userEmail = response.data.email;
            const userDui = response.data.dui; // Assuming the response includes the DUI
            const userName = response.data.name;
            const container = document.getElementById('accounts-container');

            // Use the fetched email to get associated bank accounts
            axios.get(`/api/account/${encodeURIComponent(userEmail)}`)
                .then(response => {
                    const accounts = response.data;
                    document.getElementById('welcome-sign').textContent = `Bienvenido, ${userName}`;

                    if (accounts.length === 0) {
                        container.innerHTML = '<p>No se encontraron cuentas.</p>';
                    } else {
                        accounts.forEach(account => {
                            const formattedAccountNumber = formatAccountNumber(account.accountNumber);
                            const accountCard = document.createElement('div');
                            accountCard.classList.add('card', 'account-card');
                            accountCard.innerHTML = `
                                <div class="card-body">
                                    <h5 class="card-title">Número de cuenta: ${formattedAccountNumber}</h5>
                                    <p class="card-text">Saldo: <strong>$${account.balance.toFixed(2)}</strong></p>
                                </div>
                            `;
                            container.appendChild(accountCard);
                        });
                    }

                    // Create "Agregar Nueva Cuenta" button if accounts are less than 3
                    if (accounts.length < 3) {
                        const addButton = document.createElement('button');
                        addButton.classList.add('btn', 'btn-add-account');
                        addButton.textContent = 'Agregar Nueva Cuenta';
                        addButton.onclick = function () {
                            createNewAccount(userEmail, userDui);
                        };
                        container.appendChild(addButton);
                    }
                })
                .catch(error => {
                    console.error('Error fetching accounts:', error);
                    document.getElementById('accounts-container').innerHTML = '<p>Error al cargar cuentas. Por favor intente más tarde.</p>';
                });
        })
        .catch(error => {
            console.error('Error fetching user email:', error);
            document.getElementById('accounts-container').innerHTML = '<p>Error al cargar detalles del usuario. Por favor intente más tarde.</p>';
        });

    // Function to create a new account with a random account number and DUI
    function createNewAccount(userEmail, userDui) {
        const randomAccountNumber = Math.floor(10000000 + Math.random() * 90000000).toString(); // Generates an 8-digit number

        axios.post('/api/account', {
            accountNumber: randomAccountNumber,
            userEmail: userEmail,
            balance: 0.0, // Initial balance
            dui: userDui // Include the user's DUI
        })
            .then(response => {
                Swal.fire({
                    icon: 'success',
                    title: 'Nueva Cuenta Creada',
                    text: `La cuenta número ${formatAccountNumber(randomAccountNumber)} se ha creado exitosamente.`,
                    confirmButtonText: 'OK'
                }).then(() => {
                    location.reload(); // Reload the page to refresh the account list
                });
            })
            .catch(error => {
                console.error('Error creating new account:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error al Crear Cuenta',
                    text: error.response ? error.response.data : 'Ocurrió un error desconocido',
                    confirmButtonText: 'Intentar Nuevamente'
                });
            });
    }
</script>
</body>
</html>
