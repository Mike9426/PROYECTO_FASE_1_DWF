<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Cajero</title>

    <!-- Bootstrap & Iconos -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes (IGUAL QUE EL PANEL GERENTE) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap"
          rel="stylesheet">

    <!-- Axios & SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', 'Lato', sans-serif;
            background-color: #f4f6f9;
        }

        .d-flex {
            min-height: 100vh;
        }

        /* -------- SIDEBAR OFICIAL (mismo estilo del dashboard cliente / gerente) -------- */
        .sidebar {
            height: 100vh;
            background: #111827;
            color: #e5e7eb;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 12px rgba(15, 23, 42, 0.35);
        }

        .profile-img {
            width: 82px;
            height: 82px;
            border-radius: 999px;
            margin: 0 auto 22px auto;
            border: 3px solid #10B981;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .profile-img:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        }

        .user-summary {
            text-align: left;
            margin-bottom: 30px;
        }

        .user-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #f9fafb;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 10px;
            background-color: transparent;
            color: #e5e7eb;
            text-decoration: none;
            transition: all 0.25s ease;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar .nav-link:hover {
            background-color: #1f2937;
            transform: translateX(3px);
            border-left-color: #10B981;
            color: #ffffff;
        }

        .sidebar .nav-link.active {
            background-color: #1f2937;
            border-left-color: #10B981;
            color: #ffffff;
        }

        .sidebar .logout-btn {
            margin-top: auto;
            margin-bottom: 10px;
            width: 100%;
            background-color: #ef4444;
            border: none;
            color: white;
            padding: 11px;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .sidebar .logout-btn i {
            margin-right: 6px;
        }

        .sidebar .logout-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
        }

        /* -------- MAIN CONTENT -------- */
        .main-content {
            padding: 40px;
        }

        /* Cabecera similar al estilo general (puedes usar esta o dejar solo el título) */
        .welcome-section {
            background: linear-gradient(to right, #10B981, #059669);
            color: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
        }

        .welcome-title {
            margin: 0;
            font-weight: 600;
            font-size: 20px;
        }

        .welcome-subtitle {
            margin: 4px 0 0;
            font-size: 14px;
            opacity: 0.95;
        }

        .section-title {
            color: #1f2937;
            font-weight: 600;
            margin: 24px 0 18px;
            position: relative;
            font-size: 18px;
        }

        .section-title:after {
            content: '';
            display: block;
            width: 70px;
            height: 3px;
            background: #10B981;
            margin-top: 8px;
            border-radius: 999px;
        }

        /* -------- TABLE -------- */
        .table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }

        .table thead th {
            background: #111827;
            color: #E5E7EB;
            border: none;
            font-size: 14px;
            padding: 14px;
        }

        .table tbody tr {
            transition: background 0.15s ease;
        }

        .table tbody tr:hover {
            background-color: rgba(16, 185, 129, 0.08);
        }

        .table td {
            color: #1f2937;
            font-size: 14px;
            padding: 14px;
        }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- SIDEBAR (MISMO ESTILO) -->
    <div class="sidebar">

        <div class="user-summary">
            <div class="user-label">Panel de</div>
            <div class="user-name">Cajero</div>
        </div>

        <a href="/cajero/manage-loans" class="nav-link">
            <i class="fas fa-exchange-alt"></i> Gestionar dinero
        </a>

        <a href="/cajero/open-loan" class="nav-link">
            <i class="fas fa-plus-circle"></i> Nuevo préstamo
        </a>

        <a href="/cajero/register-client" class="nav-link">
            <i class="fas fa-users"></i> Registrar cliente
        </a>

        <button class="logout-btn" onclick="window.location.href='/logout'">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="flex-grow-1 main-content">
        <div class="container-fluid">
            <!-- Header / Welcome -->
            <div class="welcome-section">
                <h3 class="welcome-title" id="welcome-sign">
                    Listado de Préstamos
                </h3>
                <p class="welcome-subtitle mb-0">Préstamos activos registrados en el sistema</p>
            </div>

            <!-- Título sección -->
            <h5 class="section-title">Préstamos</h5>

            <!-- Tabla -->
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID Préstamo</th>
                        <th>Monto</th>
                        <th>Tasa de Interés (%)</th>
                        <th>Plazo (Años)</th>
                        <th>Pago Mensual</th>
                        <th>Estado</th>
                    </tr>
                    </thead>
                    <tbody id="loan-list">
                    <!-- Las filas de préstamos aparecerán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Función para formatear el número de cuenta en grupos de 3 dígitos
    function formatAccountNumber(accountNumber) {
        return accountNumber.replace(/(\d{3})(?=\d)/g, '$1-');
    }

    // Obtener el email y DUI del usuario actualmente logueado
    axios.get('/api/users/current')
        .then(response => {
            const userEmail = response.data.email;
            const userDui = response.data.dui;
            const userName = response.data.name;

            // Actualizar el mensaje de bienvenida
            document.getElementById('welcome-sign').textContent =
                `Bienvenido ${userName}, listado de préstamos`;

            // Obtener y mostrar los préstamos
            axios.get('/api/loans')
                .then(response => {
                    const loans = response.data;
                    const loanList = document.getElementById('loan-list');

                    loans.forEach(loan => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${loan.id}</td>
                            <td>$${loan.amount.toFixed(2)}</td>
                            <td>${loan.interestRate.toFixed(2)}</td>
                            <td>${loan.termInYears}</td>
                            <td>$${loan.monthlyPayment.toFixed(2)}</td>
                            <td>${loan.status}</td>
                        `;
                        loanList.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error al obtener préstamos:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'No se pudieron cargar los préstamos'
                    });
                });
        })
        .catch(error => {
            console.error('Error al obtener detalles del usuario:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudieron cargar los datos del usuario'
            });
        });

    // Función para crear una nueva cuenta con un número de cuenta aleatorio y DUI
    function createNewAccount(userEmail, userDui) {
        const randomAccountNumber = Math.floor(10000000 + Math.random() * 90000000).toString();

        axios.post('/api/account', {
            accountNumber: randomAccountNumber,
            userEmail: userEmail,
            balance: 0.0,
            dui: userDui
        })
            .then(response => {
                Swal.fire({
                    icon: 'success',
                    title: 'Nueva Cuenta Creada',
                    text: `La cuenta número ${formatAccountNumber(randomAccountNumber)} ha sido creada exitosamente.`,
                    confirmButtonText: 'OK'
                }).then(() => {
                    location.reload();
                });
            })
            .catch(error => {
                console.error('Error al crear nueva cuenta:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error al Crear Cuenta',
                    text: error.response ? error.response.data : 'Ocurrió un error desconocido',
                    confirmButtonText: 'Intentar Nuevamente'
                });
            });
    }
</script>
</body>
</html>
