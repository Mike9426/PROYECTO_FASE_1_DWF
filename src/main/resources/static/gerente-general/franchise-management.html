<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Sucursales | Gerente General</title>

    <!-- Bootstrap & Iconos -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- jQuery / Popper / Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
            crossorigin="anonymous"></script>

    <!-- Axios & SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --accent-green: #10B981;
            --accent-green-dark: #059669;
            --sidebar-bg: #111827;
            --danger-color: #ef4444;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }

        .d-flex {
            min-height: 100vh;
        }

        /* ---------- SIDEBAR ---------- */
        .sidebar {
            height: 100vh;
            background: var(--sidebar-bg);
            color: #e5e7eb;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 12px rgba(15, 23, 42, 0.35);
        }

        .user-summary {
            text-align: left;
            margin-bottom: 30px;
        }

        .user-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #f9fafb;
        }

        .sidebar .profile-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin-bottom: 16px;
            border: 2px solid #4b5563;
            object-fit: cover;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 10px;
            background-color: transparent;
            color: #e5e7eb;
            text-decoration: none;
            transition: all 0.25s ease;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar .nav-link:hover {
            background-color: #1f2937;
            transform: translateX(3px);
            border-left-color: var(--accent-green);
            color: #ffffff;
        }

        .sidebar .nav-link.active {
            background-color: #1f2937;
            border-left-color: var(--accent-green);
            color: #ffffff;
        }

        .sidebar .logout-btn {
            margin-top: auto;
            margin-bottom: 10px;
            width: 100%;
            background-color: var(--danger-color);
            border: none;
            color: white;
            padding: 11px;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .sidebar .logout-btn i {
            margin-right: 6px;
        }

        .sidebar .logout-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
        }

        /* ---------- MAIN CONTENT ---------- */
        .main-content {
            padding: 32px 32px 40px;
        }

        .welcome-section {
            background: linear-gradient(to right, var(--accent-green), var(--accent-green-dark));
            color: white;
            padding: 22px 24px;
            border-radius: 14px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .welcome-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .welcome-subtitle {
            opacity: 0.95;
            font-size: 13px;
        }

        .welcome-section i {
            font-size: 22px;
        }

        /* Botones superiores */
        .top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 18px;
        }

        .btn-pill {
            border-radius: 999px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            transition: all 0.25s ease;
        }

        .btn-add-branch {
            background: #0f172a;
            color: #f9fafb;
        }

        .btn-add-branch:hover {
            background: #020617;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
        }

        .btn-add-manager {
            background: #ffffff;
            color: #111827;
            border: 1px solid #d1d5db;
        }

        .btn-add-manager:hover {
            background: #f9fafb;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
        }

        /* ---------- TABLA ---------- */
        .table-card {
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .table-header {
            background: #0f172a;
            color: #e5e7eb;
        }

        .table-header th {
            border: none;
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .table tbody tr {
            transition: background-color 0.15s ease;
        }

        .table tbody tr:hover {
            background-color: #f3f4f6;
        }

        .assign-btn {
            border-radius: 999px;
            font-size: 13px;
            padding: 5px 14px;
            background: var(--accent-green);
            border: none;
        }

        .assign-btn:hover {
            background: var(--accent-green-dark);
        }

        /* ---------- MODALES ---------- */
        .modal-content {
            border-radius: 16px;
            border: none;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
        }

        .modal-header {
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-title {
            font-weight: 600;
            font-size: 16px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
        }

        .form-control, .form-select {
            border-radius: 999px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            padding: 10px 16px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 0.15rem rgba(16, 185, 129, 0.25);
        }

        .btn-modal-primary {
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            background: var(--accent-green);
            border: none;
        }

        .btn-modal-primary:hover {
            background: var(--accent-green-dark);
        }

        .btn-modal-secondary {
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="user-summary">
            <div class="user-label">Panel de</div>
            <div class="user-name">Gerente General</div>
        </div>

        <a href="/gerente_general/employee_actions" class="nav-link">
            <i class="fas fa-users-cog"></i> Acciones de Personal
        </a>
        <a href="/gerente_general/franchise-management" class="nav-link active">
            <i class="fas fa-building"></i> Gestionar Sucursales
        </a>
        <a href="/gerente_general/transactions-overview" class="nav-link">
            <i class="fas fa-exchange-alt"></i> Transacciones
        </a>
        <a href="/gerente_general/reports" class="nav-link">
            <i class="fas fa-chart-bar"></i> Reportes
        </a>

        <button class="logout-btn" onclick="window.location.href='/logout'">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content flex-grow-1">
        <div class="welcome-section">
            <div>
                <h3 class="welcome-title">
                    <i class="fas fa-user-tie"></i>
                    Bienvenido, Gerente General
                </h3>
                <p class="welcome-subtitle mb-0">Gestión de sucursales y gerentes asignados</p>
            </div>
        </div>

        <div class="top-actions">
            <button class="btn-pill btn-add-branch" id="add-branch-btn">
                <i class="fas fa-plus-circle mr-1"></i> Nueva sucursal
            </button>
            <button class="btn-pill btn-add-manager" id="add-gerente-sucursal-btn">
                <i class="fas fa-user-plus mr-1"></i> Nuevo gerente de sucursal
            </button>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead class="table-header">
                    <tr>
                        <th>ID</th>
                        <th>Sucursal</th>
                        <th>Ubicación</th>
                        <th>Gerente</th>
                        <th>Email del gerente</th>
                        <th class="text-center">Asignar gerente</th>
                    </tr>
                    </thead>
                    <tbody id="branch-table-body">
                    <!-- Se llenará dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal para Asignar Gerente -->
    <div class="modal fade" id="assignManagerModal" tabindex="-1" aria-labelledby="assignManagerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="assignManagerModalLabel">Asignar gerente a sucursal</h5>
                    <button type="button" class="close btn-modal-secondary" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="assign-manager-form">
                        <div class="form-group">
                            <label for="manager-select" class="form-label">Seleccionar gerente</label>
                            <select class="form-control" id="manager-select">
                                <!-- Opciones se llenarán dinámicamente -->
                            </select>
                        </div>
                        <input type="hidden" id="selected-branch-id" />
                        <div class="mt-3 text-right">
                            <button type="submit" class="btn btn-modal-primary">
                                <i class="fas fa-check-circle mr-1"></i>Asignar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar nueva sucursal -->
    <div class="modal fade" id="addBranchModal" tabindex="-1" aria-labelledby="addBranchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addBranchModalLabel">Agregar nueva sucursal</h5>
                    <button type="button" class="close btn-modal-secondary" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="add-branch-form">
                        <div class="form-group">
                            <label for="branch-name" class="form-label">Nombre de sucursal</label>
                            <input type="text" class="form-control" id="branch-name" required>
                        </div>
                        <div class="form-group">
                            <label for="branch-location" class="form-label">Ubicación</label>
                            <input type="text" class="form-control" id="branch-location" required>
                        </div>
                        <div class="mt-3 text-right">
                            <button type="submit" class="btn btn-modal-primary">
                                <i class="fas fa-save mr-1"></i>Guardar sucursal
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar nuevo gerente de sucursal -->
    <div class="modal fade" id="addGerenteSucursalModal" tabindex="-1" aria-labelledby="addGerenteSucursalModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addGerenteSucursalModalLabel">Agregar nuevo gerente</h5>
                    <button type="button" class="close btn-modal-secondary" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="add-gerente-sucursal-form">
                        <div class="form-group">
                            <label for="gerente-name" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="gerente-name" required>
                        </div>
                        <div class="form-group">
                            <label for="gerente-email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="gerente-email" required>
                        </div>
                        <div class="form-group">
                            <label for="gerente-dui" class="form-label">DUI</label>
                            <input type="text" class="form-control" id="gerente-dui" placeholder="00000000-0" required>
                        </div>
                        <div class="form-group">
                            <label for="gerente-password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="gerente-password" required>
                        </div>
                        <div class="mt-3 text-right">
                            <button type="submit" class="btn btn-modal-primary">
                                <i class="fas fa-user-plus mr-1"></i>Agregar gerente
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Abrir modales por botones superiores
    document.getElementById('add-branch-btn').addEventListener('click', () => {
        const branchModal = new bootstrap.Modal(document.getElementById('addBranchModal'));
        branchModal.show();
    });

    document.getElementById('add-gerente-sucursal-btn').addEventListener('click', () => {
        const gerenteModal = new bootstrap.Modal(document.getElementById('addGerenteSucursalModal'));
        gerenteModal.show();
    });

    document.addEventListener('DOMContentLoaded', function () {
        // Obtener todas las sucursales
        axios.get('/api/branches/all')
            .then(response => {
                const branches = response.data;
                const tableBody = document.getElementById('branch-table-body');
                tableBody.innerHTML = '';

                branches.forEach(branch => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${branch.id}</td>
                        <td>${branch.name}</td>
                        <td>${branch.location}</td>
                        <td>${branch.managerName || 'Sin asignar'}</td>
                        <td>${branch.managerEmail || 'Sin asignar'}</td>
                        <td class="text-center">
                            <button class="btn assign-btn btn-sm assign-btn" data-id="${branch.id}">
                                Asignar
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                // Agregar eventos a los botones de asignar
                agregarEventosAsignar();
            })
            .catch(error => console.error('Error al obtener sucursales:', error));

        // Manejar envío de asignación
        document.getElementById('assign-manager-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const managerId = document.getElementById('manager-select').value;
            const branchId = document.getElementById('selected-branch-id').value;

            axios.put(`/api/branches/${branchId}/assign/${managerId}`)
                .then(response => {
                    Swal.fire({
                        icon: 'success',
                        title: 'Gerente asignado',
                        text: 'El gerente ha sido asignado exitosamente a la sucursal.',
                    }).then(() => {
                        location.reload();
                    });
                })
                .catch(error => {
                    console.error('Error al asignar gerente:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Asignación fallida',
                        text: 'No se pudo asignar el gerente. Por favor intente más tarde.',
                    });
                });
        });

        // Enviar formulario de nueva sucursal
        document.getElementById('add-branch-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const branchName = document.getElementById('branch-name').value;
            const branchLocation = document.getElementById('branch-location').value;

            axios.post('/api/branches/new-branch', { name: branchName, location: branchLocation })
                .then(response => {
                    Swal.fire({
                        icon: 'success',
                        title: 'Sucursal agregada',
                        text: 'La nueva sucursal fue agregada exitosamente.',
                    }).then(() => {
                        location.reload();
                    });
                })
                .catch(error => {
                    console.error('Error al agregar sucursal:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'No se pudo agregar la sucursal. Por favor intente más tarde.',
                    });
                });
        });

        // Enviar formulario de nuevo gerente de sucursal
        document.getElementById('add-gerente-sucursal-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const gerenteName = document.getElementById('gerente-name').value;
            const gerenteEmail = document.getElementById('gerente-email').value;
            const gerenteDui = document.getElementById('gerente-dui').value;
            const gerentePassword = document.getElementById('gerente-password').value;

            axios.post('/api/users/register', {
                name: gerenteName,
                email: gerenteEmail,
                dui: gerenteDui,
                password: gerentePassword,
                role: 'GERENTE_SUCURSAL',
            })
                .then(response => {
                    Swal.fire({
                        icon: 'success',
                        title: 'Gerente agregado',
                        text: 'El nuevo gerente fue agregado exitosamente.',
                    }).then(() => {
                        location.reload();
                    });
                })
                .catch(error => {
                    console.error('Error al agregar gerente:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'No se pudo agregar el gerente. Por favor intente más tarde.',
                    });
                });
        });

        function agregarEventosAsignar() {
            document.querySelectorAll('.assign-btn').forEach(button => {
                button.addEventListener('click', function () {
                    const branchId = this.getAttribute('data-id');
                    document.getElementById('selected-branch-id').value = branchId;

                    // Cargar la lista de gerentes en el dropdown
                    cargarGerentes();
                    const modal = new bootstrap.Modal(document.getElementById('assignManagerModal'));
                    modal.show();
                });
            });
        }

        function cargarGerentes() {
            axios.get('/api/users/gerente-sucursal')
                .then(response => {
                    const managers = response.data;
                    const managerSelect = document.getElementById('manager-select');
                    managerSelect.innerHTML = '';

                    managers.forEach(manager => {
                        const option = document.createElement('option');
                        option.value = manager.id;
                        option.textContent = `${manager.name} (${manager.email})`;
                        managerSelect.appendChild(option);
                    });
                })
                .catch(error => console.error('Error al obtener gerentes:', error));
        }
    });
</script>
</body>
</html>
