<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <style>
        body {
            background: #f4f6f9;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            overflow: hidden;
            background: #ffffff;
        }

        .card-header {
            background: #ffffff;
            border-bottom: none;
            padding: 25px;
            text-align: center;
        }

        .login-title {
            font-weight: 600;
            color: #2c3e50;
            font-family: 'Poppins', sans-serif;
        }

        .card-body {
            padding: 30px;
            background: #ffffff;
        }

        label {
            font-family: 'Lato', sans-serif;
            font-weight: 400;
            color: #2c3e50;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1.5px solid #d8dce2;
            transition: all .3s;
            font-family: 'Lato', sans-serif;
            background: #fff;
        }

        .form-control:focus {
            border-color: #1abc9c;
            box-shadow: 0 0 0 0.2rem rgba(26, 188, 156, 0.25);
        }

        .btn-login {
            background: #1abc9c;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: white;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-login:hover {
            background: #159a80;
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(26,188,156,0.2);
        }

        .register-link {
            color: #1abc9c;
            font-weight: 600;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
        }

        .register-link:hover {
            color: #159a80;
        }

    </style>
    <script>
        function submitLoginForm() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            axios.post('/api/users/login', {
                email: email,
                password: password
            })
                .then(response => {
                    if (response.status === 200) {

                        const userRole = response.data.role;
                        console.log("userRole 1: "+userRole);
                        // Display SweetAlert confirmation
                        Swal.fire({
                            title: '¡Éxito!',
                            text: `¡Inicio de sesión exitoso! Tu rol es ${userRole}`,
                            icon: 'success',
                            confirmButtonText: 'OK'
                        }).then(() => {
                            // Redirect to their respective dashboards
                            console.log("userRole: "+userRole);
                            switch (userRole) {
                                case 'CLIENT':
                                    window.location.href = '/client/dashboard';
                                    break;
                                case 'DEPENDIENTE':
                                    window.location.href = '/dependiente/dashboard';
                                    break;
                                case 'CAJERO':
                                    window.location.href = '/cajero/dashboard';
                                    break;
                                case 'GERENTE_SUCURSAL':
                                    window.location.href = '/gerente_sucursal/dashboard';
                                    break;
                                case 'GERENTE_GENERAL':
                                    window.location.href = '/gerente_general/dashboard';
                                    break;
                                default:
                                    window.location.href = '/unauthorized';
                            }// Fallback for unknown roles
                        });
                    }
                })
                .catch(error => {
                    document.getElementById('error-message').innerText = 'Credenciales inválidas';
                    console.error('Login error:', error);
                    // Display SweetAlert error
                    Swal.fire({
                        title: '¡Error!',
                        text: 'Credenciales de inicio de sesión inválidas.',
                        icon: 'error',
                        confirmButtonText: 'Intentar nuevamente'
                    });
                });
        }
    </script>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card login-card">
                <div class="card-header text-center">
                    <h3 class="login-title">Banco de Agricultura Salvadoreño SA de CV</h3>
                </div>
                <div class="card-body">
                    <form onsubmit="event.preventDefault(); submitLoginForm();">
                        <div class="form-group">
                            <label for="email">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-login">Iniciar Sesión</button>
                        <div class="text-center mt-3">
                            <span>¿No tienes una cuenta? </span>
                            <a id="register" href="/register" class="register-link">Regístrate aquí</a>
                        </div>
                    </form>
                    <div id="error-message" class="text-danger mt-3 text-center"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
