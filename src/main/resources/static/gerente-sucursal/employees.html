<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados | Banco Pipil</title>

    <!-- Bootstrap & Iconos -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap"
          rel="stylesheet">

    <!-- Axios & SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-green: #10B981;
            --primary-green-dark: #059669;
            --sidebar-bg: #111827;
            --danger-color: #ef4444;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', 'Lato', sans-serif;
            background-color: #f4f6f9;
        }

        .d-flex {
            min-height: 100vh;
        }

        /* ---------- SIDEBAR (estilo dashboard nuevo) ---------- */
        .sidebar {
            height: 100vh;
            background: var(--sidebar-bg);
            color: #e5e7eb;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 12px rgba(15, 23, 42, 0.35);
        }

        .user-summary {
            text-align: left;
            margin-bottom: 30px;
        }

        .user-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #f9fafb;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 10px;
            background-color: transparent;
            color: #e5e7eb;
            text-decoration: none;
            transition: all 0.25s ease;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar .nav-link:hover {
            background-color: #1f2937;
            transform: translateX(3px);
            border-left-color: var(--primary-green);
            color: #ffffff;
        }

        .sidebar .nav-link.active {
            background-color: #1f2937;
            border-left-color: var(--primary-green);
            color: #ffffff;
        }

        .sidebar .logout-btn {
            margin-top: auto;
            margin-bottom: 10px;
            width: 100%;
            background-color: var(--danger-color);
            border: none;
            color: white;
            padding: 11px;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .sidebar .logout-btn i {
            margin-right: 6px;
        }

        .sidebar .logout-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
        }

        /* ---------- MAIN CONTENT ---------- */
        .main-content {
            padding: 40px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e5e7eb;
        }

        .page-title {
            color: #1f2937;
            font-weight: 600;
            margin: 0;
            font-size: 20px;
            position: relative;
            padding-bottom: 4px;
        }

        .page-title i {
            color: var(--primary-green);
        }

        .page-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 80px;
            height: 3px;
            background: var(--primary-green);
            border-radius: 999px;
        }

        .btn-primary-custom {
            background: linear-gradient(to right, var(--primary-green), var(--primary-green-dark));
            border: none;
            border-radius: 999px;
            padding: 9px 20px;
            color: white;
            font-weight: 500;
            transition: all 0.25s ease;
            font-size: 14px;
        }

        .btn-primary-custom:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.35);
            color: white;
        }

        .table-custom {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
            background: #ffffff;
        }

        .table-custom thead {
            background: #111827;
            color: #f9fafb;
        }

        .table-custom th {
            border: none;
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .table-custom td {
            vertical-align: middle;
            font-size: 14px;
            color: #374151;
        }

        .table-hover tbody tr:hover {
            background-color: #f3f4f6;
        }

        .status-active {
            color: #059669;
            font-weight: 600;
        }

        .status-inactive {
            color: #ef4444;
            font-weight: 600;
        }

        .action-btn {
            border-radius: 999px;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .action-btn.btn-warning {
            background-color: #fbbf24;
            border-color: #fbbf24;
            color: #111827;
        }

        .action-btn.btn-warning:hover {
            background-color: #f59e0b;
            border-color: #f59e0b;
        }

        .action-btn.btn-success {
            background-color: #10B981;
            border-color: #10B981;
        }

        .action-btn.btn-success:hover {
            background-color: #059669;
            border-color: #059669;
        }

        /* ---------- MODALES ---------- */
        .modal-content {
            border-radius: 16px;
            border: none;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.35);
        }

        .modal-header {
            background: linear-gradient(to right, var(--primary-green), var(--primary-green-dark));
            color: white;
            border-radius: 16px 16px 0 0 !important;
            border: none;
        }

        .modal-title {
            font-weight: 600;
        }

        .modal-header .close span {
            color: white;
            font-size: 26px;
        }

        .form-control {
            border-radius: 999px;
            padding: 11px 20px;
            border: 2px solid #e5e7eb;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.25);
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
        }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="user-summary">
            <div class="user-label">Panel de</div>
            <div class="user-name">Gerente de Sucursal</div>
        </div>

        <a href="/gerente_sucursal/employees" class="nav-link active">
            <i class="fas fa-users"></i> Gestionar Empleados
        </a>
        <a href="/gerente_sucursal/loans" class="nav-link">
            <i class="fas fa-file-invoice-dollar"></i> Préstamos Activos
        </a>
        <a href="/gerente_sucursal/reports" class="nav-link">
            <i class="fas fa-chart-bar"></i> Reportes
        </a>

        <button class="logout-btn" onclick="window.location.href='/logout'">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content flex-grow-1">
        <div class="page-header">
            <h2 class="page-title">
                <i class="fas fa-users-cog mr-2"></i>Gestión de Empleados
            </h2>
            <div>
                <button type="button" id="open-register-employee-modal" class="btn btn-primary-custom mr-2">
                    <i class="bi bi-person-plus mr-1"></i>Nuevo Empleado
                </button>
                <button type="button" id="open-create-action-modal" class="btn btn-primary-custom">
                    <i class="fas fa-file-signature mr-1"></i>Acción de Personal
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-custom table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Correo Electrónico</th>
                    <th>DUI</th>
                    <th>Estado</th>
                    <th style="width: 150px;">Acciones</th>
                </tr>
                </thead>
                <tbody id="employee-table-body">
                <!-- Filas se llenarán dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal para registrar nuevo empleado -->
<div class="modal fade" id="registerEmployeeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-plus mr-2"></i>Registrar Nuevo Empleado</h5>
                <button type="button" class="close" onclick="closeRegisterModal()" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="register-employee-form">
                    <div class="form-group">
                        <label for="employee-name">Nombre Completo</label>
                        <input type="text" class="form-control" id="employee-name" required>
                    </div>
                    <div class="form-group">
                        <label for="employee-dui">Número de DUI</label>
                        <input type="text" class="form-control" id="employee-dui" placeholder="00000000-0" required>
                    </div>
                    <div class="form-group">
                        <label for="employee-email">Correo Electrónico</label>
                        <input type="email" class="form-control" id="employee-email" required>
                    </div>
                    <div class="form-group">
                        <label for="employee-password">Contraseña</label>
                        <input type="password" class="form-control" id="employee-password" required>
                        <small class="form-text text-muted">Mínimo 8 caracteres</small>
                    </div>
                    <div class="text-right mt-4">
                        <button type="submit" class="btn btn-primary-custom px-4">
                            <i class="fas fa-save mr-2"></i>Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal para crear acción de personal -->
<div class="modal fade" id="createActionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-file-alt mr-2"></i>Acción de Personal</h5>
                <button type="button" class="close" onclick="closeActionModal()" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="create-action-form">
                    <div class="form-group">
                        <label for="employee-id-dropdown">Seleccionar Empleado</label>
                        <select class="form-control" id="employee-id-dropdown" required>
                            <option value="">Seleccione un empleado</option>
                            <!-- Opciones se llenarán dinámicamente -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="action-type">Tipo de Acción</label>
                        <select class="form-control" id="action-type" required>
                            <option value="HIRE">Contratación</option>
                            <option value="FIRE">Despido</option>
                            <option value="PROMOTION">Promoción</option>
                        </select>
                    </div>
                    <div class="text-right mt-4">
                        <button type="submit" class="btn btn-primary-custom px-4">
                            <i class="fas fa-check-circle mr-2"></i>Confirmar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Variables globales para los modales
    let registerEmployeeModal, createActionModal;

    document.addEventListener('DOMContentLoaded', function() {
        // Bootstrap 4 usa $('#id').modal(), pero si tienes Bootstrap 5 puedes usar lo de abajo.
        if (window.bootstrap && bootstrap.Modal) {
            registerEmployeeModal = new bootstrap.Modal(document.getElementById('registerEmployeeModal'));
            createActionModal = new bootstrap.Modal(document.getElementById('createActionModal'));
        }

        loadEmployees();
        setupEventListeners();
    });

    function setupEventListeners() {
        document.getElementById('open-register-employee-modal')
            .addEventListener('click', function() {
                if (registerEmployeeModal) {
                    registerEmployeeModal.show();
                } else {
                    $('#registerEmployeeModal').modal('show');
                }
            });

        document.getElementById('open-create-action-modal')
            .addEventListener('click', function() {
                populateEmployeeDropdown();
                if (createActionModal) {
                    createActionModal.show();
                } else {
                    $('#createActionModal').modal('show');
                }
            });

        document.getElementById('register-employee-form')
            .addEventListener('submit', registerEmployee);

        document.getElementById('create-action-form')
            .addEventListener('submit', createEmployeeAction);
    }

    // Cargar lista de empleados
    function loadEmployees() {
        axios.get('/api/users/cajero')
            .then(response => {
                const tableBody = document.getElementById('employee-table-body');
                tableBody.innerHTML = '';

                response.data.forEach((employee, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${employee.name}</td>
                        <td>${employee.email}</td>
                        <td>${formatDUI(employee.dui)}</td>
                        <td class="${employee.status === 'ACTIVE' ? 'status-active' : 'status-inactive'}">
                            ${employee.status === 'ACTIVE' ? 'Activo' : 'Inactivo'}
                        </td>
                        <td>
                            <button class="btn btn-sm action-btn ${employee.status === 'ACTIVE' ? 'btn-warning' : 'btn-success'}"
                                onclick="${employee.status === 'ACTIVE'
                        ? 'deactivateUser'
                        : 'activateUser'}(${employee.id}, '${employee.name}')">
                                ${employee.status === 'ACTIVE' ? 'Desactivar' : 'Activar'}
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error al cargar empleados:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'No se pudo cargar la lista de empleados. Por favor, intente más tarde.',
                });
            });
    }

    // Formatear DUI
    function formatDUI(dui) {
        if (!dui) return '';
        if (dui.includes('-')) return dui;
        return dui.replace(/(\d{8})(\d)/, '$1-$2');
    }

    // Registrar nuevo empleado
    function registerEmployee(event) {
        event.preventDefault();

        const name = document.getElementById('employee-name').value.trim();
        const dui = document.getElementById('employee-dui').value;
        const email = document.getElementById('employee-email').value.trim();
        const password = document.getElementById('employee-password').value;

        if (!name || !dui || !email || !password) {
            showError('Por favor complete todos los campos');
            return;
        }

        if (password.length < 8) {
            showError('La contraseña debe tener al menos 8 caracteres');
            return;
        }

        if (!/^\d{8}-\d$/.test(dui)) {
            showError('El DUI debe tener el formato 00000000-0');
            return;
        }

        Swal.fire({
            title: 'Confirmar Registro',
            html: `¿Desea registrar al empleado <b>${name}</b>?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Confirmar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                axios.post('/api/users/register', {
                    name: name,
                    dui: dui,
                    email: email,
                    password: password,
                    role: 'CAJERO',
                    status: 'ACTIVE'
                })
                    .then(() => {
                        Swal.fire({
                            icon: 'success',
                            title: 'Empleado Registrado',
                            html: `<b>${name}</b> ha sido registrado exitosamente.`,
                        });
                        document.getElementById('register-employee-form').reset();
                        if (registerEmployeeModal) {
                            registerEmployeeModal.hide();
                        } else {
                            $('#registerEmployeeModal').modal('hide');
                        }
                        loadEmployees();
                    })
                    .catch(error => {
                        console.error('Error al registrar empleado:', error);
                        const errorMsg = error.response?.data || 'Error al registrar empleado';
                        showError(errorMsg);
                    });
            }
        });
    }

    // Crear acción de personal
    function createEmployeeAction(event) {
        event.preventDefault();

        const employeeDropdown = document.getElementById('employee-id-dropdown');
        const employeeId = employeeDropdown.value;
        const actionType = document.getElementById('action-type').value;
        const employeeName = employeeDropdown.options[employeeDropdown.selectedIndex].text;

        if (!employeeId) {
            showError('Por favor seleccione un empleado');
            return;
        }

        let actionTypeText = '';
        switch(actionType) {
            case 'HIRE': actionTypeText = 'Contratación'; break;
            case 'FIRE': actionTypeText = 'Despido'; break;
            case 'PROMOTION': actionTypeText = 'Promoción'; break;
        }

        Swal.fire({
            title: 'Confirmar Acción',
            html: `¿Desea registrar una acción de <b>${actionTypeText}</b> para <b>${employeeName}</b>?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Confirmar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                axios.post('/api/actions/create', {
                    employeeId: employeeId,
                    actionType: actionType
                })
                    .then(() => {
                        Swal.fire({
                            icon: 'success',
                            title: 'Acción Registrada',
                            html: `La acción de <b>${actionTypeText}</b> para <b>${employeeName}</b> ha sido registrada.`,
                        });
                        document.getElementById('create-action-form').reset();
                        if (createActionModal) {
                            createActionModal.hide();
                        } else {
                            $('#createActionModal').modal('hide');
                        }
                        loadEmployees();
                    })
                    .catch(error => {
                        console.error('Error al crear acción:', error);
                        const errorMsg = error.response?.data || 'Error al registrar acción';
                        showError(errorMsg);
                    });
            }
        });
    }

    // Activar/Desactivar usuario
    function toggleUserStatus(userId, userName, action) {
        const endpoint = action === 'activate' ? 'activate' : 'deactivate';
        const actionText = action === 'activate' ? 'activar' : 'desactivar';

        Swal.fire({
            title: 'Confirmar Acción',
            html: `¿Está seguro que desea ${actionText} al usuario <b>${userName}</b>?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Confirmar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                axios.put(`/api/users/${endpoint}/${userId}`)
                    .then(() => {
                        Swal.fire({
                            icon: 'success',
                            title: 'Estado Actualizado',
                            html: `El usuario <b>${userName}</b> ha sido ${action === 'activate' ? 'activado' : 'desactivado'}.`,
                        });
                        loadEmployees();
                    })
                    .catch(error => {
                        console.error(`Error al ${actionText} usuario:`, error);
                        showError(`No se pudo ${actionText} el usuario. Por favor, intente más tarde.`);
                    });
            }
        });
    }

    function activateUser(userId, userName) {
        toggleUserStatus(userId, userName, 'activate');
    }

    function deactivateUser(userId, userName) {
        toggleUserStatus(userId, userName, 'deactivate');
    }

    // Llenar dropdown de empleados
    function populateEmployeeDropdown() {
        axios.get('/api/users/cajero')
            .then(response => {
                const dropdown = document.getElementById('employee-id-dropdown');
                dropdown.innerHTML = '<option value="">Seleccione un empleado</option>';

                response.data.forEach(employee => {
                    const option = document.createElement('option');
                    option.value = employee.id;
                    option.textContent = `${employee.name} (${formatDUI(employee.dui)})`;
                    dropdown.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error al cargar empleados:', error);
                showError('No se pudo cargar la lista de empleados');
            });
    }

    function showError(message) {
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: message,
        });
    }

    function closeRegisterModal() {
        if (registerEmployeeModal) {
            registerEmployeeModal.hide();
        } else {
            $('#registerEmployeeModal').modal('hide');
        }
    }

    function closeActionModal() {
        if (createActionModal) {
            createActionModal.hide();
        } else {
            $('#createActionModal').modal('hide');
        }
    }
</script>

<!-- Bootstrap JS (para modales si usas la API jQuery de BS4) -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
</body>
</html>
