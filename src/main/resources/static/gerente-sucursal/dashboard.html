<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gerente</title>

    <!-- Bootstrap & Iconos -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap"
          rel="stylesheet">

    <!-- Axios & SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', 'Lato', sans-serif;
            background-color: #f4f6f9;
        }

        .d-flex {
            min-height: 100vh;
        }

        /* ---------- SIDEBAR (mismo estilo que dashboard cliente) ---------- */
        .sidebar {
            height: 100vh;
            background: #111827;
            color: #e5e7eb;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 12px rgba(15, 23, 42, 0.35);
        }

        .user-summary {
            text-align: left;
            margin-bottom: 30px;
        }

        .user-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #f9fafb;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 10px;
            background-color: transparent;
            color: #e5e7eb;
            text-decoration: none;
            transition: all 0.25s ease;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar .nav-link:hover {
            background-color: #1f2937;
            transform: translateX(3px);
            border-left-color: #10B981;
            color: #ffffff;
        }

        .sidebar .nav-link.active {
            background-color: #1f2937;
            border-left-color: #10B981;
            color: #ffffff;
        }

        .sidebar .logout-btn {
            margin-top: auto;
            margin-bottom: 10px;
            width: 100%;
            background-color: #ef4444;
            border: none;
            color: white;
            padding: 11px;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .sidebar .logout-btn i {
            margin-right: 6px;
        }

        .sidebar .logout-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
        }

        /* ---------- MAIN CONTENT ---------- */
        .main-content {
            padding: 40px;
        }

        .welcome-message {
            background: linear-gradient(to right, #10B981, #059669);
            color: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .welcome-message h3 {
            margin: 0;
            font-weight: 600;
            font-size: 20px;
        }

        .welcome-message p {
            margin: 0;
            font-size: 14px;
            opacity: 0.95;
        }

        .dashboard-title {
            color: #1f2937;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: left;
            position: relative;
            font-size: 20px;
        }

        .dashboard-title:after {
            content: '';
            display: block;
            width: 70px;
            height: 3px;
            background: #10B981;
            margin-top: 10px;
            border-radius: 999px;
        }

        /* ---------- CARDS RESUMEN ---------- */
        .info-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            padding: 20px 18px;
            text-align: left;
            transition: all 0.25s;
            background: white;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .info-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.14);
        }

        .card-icon {
            font-size: 24px;
            margin-bottom: 12px;
            color: #10B981;
        }

        .info-card h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin: 0;
            color: #111827;
        }

        .info-card p {
            margin: 10px 0 0;
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .info-card .btn-link {
            padding-left: 0;
            margin-top: 10px;
            font-size: 13px;
            color: #10B981;
            font-weight: 500;
        }

        .info-card .btn-link:hover {
            text-decoration: none;
            color: #059669;
        }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="user-summary">
            <div class="user-label">Panel de</div>
            <div class="user-name">Gerente de Sucursal</div>
        </div>

        <a href="/gerente_sucursal/employees" class="nav-link">
            <i class="fas fa-users"></i> Gestionar Empleados
        </a>
        <a href="/gerente_sucursal/loans" class="nav-link">
            <i class="fas fa-file-invoice-dollar"></i> Préstamos Activos
        </a>
        <a href="/gerente_sucursal/reports" class="nav-link">
            <i class="fas fa-chart-bar"></i> Reportes
        </a>

        <button class="logout-btn" onclick="window.location.href='/logout'">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content flex-grow-1">
        <div class="welcome-message">
            <h3><i class="fas fa-user-tie mr-2"></i>Bienvenido, Gerente de Sucursal</h3>
            <p class="mb-0">Panel de control administrativo de tu sucursal.</p>
        </div>

        <h2 class="dashboard-title">Resumen general</h2>

        <div class="row">
            <!-- Tarjeta de Préstamos Pendientes -->
            <div class="col-md-4">
                <div class="info-card">
                    <div class="card-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h1 id="pending-loans-count">0</h1>
                    <p>Préstamos pendientes</p>
                    <a href="/gerente_sucursal/loans?status=pending" class="btn btn-link mt-2">Ver detalles</a>
                </div>
            </div>

            <!-- Tarjeta de Empleados -->
            <div class="col-md-4">
                <div class="info-card">
                    <div class="card-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <h1 id="employees-count">0</h1>
                    <p>Empleados activos</p>
                    <a href="/gerente_sucursal/employees" class="btn btn-link mt-2">Administrar</a>
                </div>
            </div>

            <!-- Tarjeta de Préstamos Aprobados -->
            <div class="col-md-4">
                <div class="info-card">
                    <div class="card-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h1 id="approved-loans-count">0</h1>
                    <p>Préstamos aprobados</p>
                    <a href="/gerente_sucursal/loans?status=approved" class="btn btn-link mt-2">Ver todos</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Cargar el conteo de préstamos pendientes
    function cargarConteoPrestamosPendientes() {
        axios.get('/api/loans/pending/count')
            .then(response => {
                const count = response.data.count;
                document.getElementById('pending-loans-count').textContent = count;
            })
            .catch(error => {
                console.error('Error al cargar préstamos pendientes:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'No se pudo cargar el conteo de préstamos pendientes. Por favor, intente más tarde.',
                });
            });
    }

    // Cargar el conteo de empleados
    function cargarConteoEmpleados() {
        axios.get('/api/employees/count')
            .then(response => {
                document.getElementById('employees-count').textContent = response.data.count;
            })
            .catch(error => {
                console.error('Error al cargar empleados:', error);
            });
    }

    // Cargar el conteo de préstamos aprobados
    function cargarConteoPrestamosAprobados() {
        axios.get('/api/loans/approved/count')
            .then(response => {
                document.getElementById('approved-loans-count').textContent = response.data.count;
            })
            .catch(error => {
                console.error('Error al cargar préstamos aprobados:', error);
            });
    }

    // Cargar todos los datos cuando la página esté lista
    document.addEventListener('DOMContentLoaded', function() {
        cargarConteoPrestamosPendientes();
        cargarConteoEmpleados();
        cargarConteoPrestamosAprobados();

        // Actualizar datos cada 60 segundos
        setInterval(() => {
            cargarConteoPrestamosPendientes();
            cargarConteoEmpleados();
            cargarConteoPrestamosAprobados();
        }, 60000);
    });
</script>
</body>
</html>
